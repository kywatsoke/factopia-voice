# Runs the automated tests on Linux, Windows and macOS.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Show what this machine can draw
        # Burmese and Chinese captions need Pillow's raqm text layout. The
        # result is shown on the run's summary page.
        run: |
          info=$(uv run --python 3.12 --no-project --with-requirements requirements.txt \
            python -c "import sys, PIL; from PIL import features as f; print('Python', sys.version.split()[0], '/ Pillow', PIL.__version__, '/ raqm', f.version('raqm') if f.check('raqm') else 'missing')")
          echo "$info"
          echo "::notice title=Text layout on $RUNNER_OS::$info"

      - name: Run the tests
        run: |
          set +e
          uv run --python 3.12 --no-project --with-requirements requirements.txt \
            --with-requirements requirements-dev.txt pytest -q -rs 2>&1 | tee pytest.txt
          status=${PIPESTATUS[0]}
          echo "::notice title=Tests on $RUNNER_OS::$(tail -n 1 pytest.txt)"
          grep '^SKIPPED' pytest.txt | while read -r line; do echo "::notice title=Skipped on $RUNNER_OS::$line"; done
          exit $status
