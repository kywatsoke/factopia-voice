# Publishes a release when a version tag such as v2.2.1 is pushed:
# runs the tests on all three platforms, builds the zip, and attaches it to a
# GitHub release whose notes are that version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' factopia_voice/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in factopia_voice/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: scripts/package.sh

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed '## $VERSION - <date>'"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" "dist/FactopiaVoice-$VERSION.zip"
          --title "Factopia Voice $VERSION" --notes-file notes.md --verify-tag
