# Publishes a release of the version in factopia_voice/__init__.py:
# runs the tests on all three platforms, builds the zip, and attaches it to a
# GitHub release whose notes are that version's section of CHANGELOG.md.
#
# Two ways to start it:
#   - Actions tab > Release > Run workflow (creates the tag v<version>)
#   - pushing a tag such as v2.2.1 from a computer with git
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' factopia_voice/__init__.py)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in factopia_voice/__init__.py"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise __version__ and add a CHANGELOG.md section first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: scripts/package.sh

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed '## $VERSION - <date>'"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >
          gh release create "$TAG" "dist/FactopiaVoice-$VERSION.zip"
          --target "$GITHUB_SHA" --title "Factopia Voice $VERSION" --notes-file notes.md
